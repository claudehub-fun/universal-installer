name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash test_install.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -File test_install.ps1
